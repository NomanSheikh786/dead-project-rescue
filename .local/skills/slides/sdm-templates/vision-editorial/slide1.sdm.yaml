format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#000000"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: eye-macro
    altText: Vision Editorial Background
    fit: cover
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 90
      stops:
        - offset: 0
          color:
            kind: rgb
            value: "#000000"
          opacity: 0.8
        - offset: 0.45
          color:
            kind: rgb
            value: "#000000"
          opacity: 0.3
        - offset: 0.6
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
