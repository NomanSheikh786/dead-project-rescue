format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#1A3A2A"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: greenhouse-interior
    altText: Greenhouse interior
    fit: cover
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 90
      stops:
        - offset: 0
          color:
            kind: rgb
            value: "#1A3A2A"
          opacity: 0.95
        - offset: 0.5
          color:
            kind: rgb
            value: "#1A3A2A"
          opacity: 0.8
        - offset: 1
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
