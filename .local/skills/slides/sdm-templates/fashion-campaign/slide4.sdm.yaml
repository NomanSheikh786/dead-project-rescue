format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#000000"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: fashion-studio
    altText: Fashion Studio
    fit: cover
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 0
      stops:
        - offset: 0
          color:
            kind: rgb
            value: "#000000"
          opacity: 0.9
        - offset: 0.5
          color:
            kind: rgb
            value: "#000000"
          opacity: 0.72
        - offset: 1
          color:
            kind: rgb
            value: "#000000"
          opacity: 0.8
  - id: text1
    type: text
    name: Join the Movement
    frame:
      x: 452.83
      y: 362.47
      width: 1014.35
      height: 255
    body:
      paragraphs:
        - runs:
            - text: Join the Movement
              font:
                kind: family
                family: Playfair Display
              sizePt: 57.6
              weight: 400
              color:
                kind: rgb
                value: "#FFFFFF"
              italic: true
              letterSpacingPt: 1.152
          align: center
          lineHeight: 1.1
      overflow: visible
  - id: text2
    type: text
    name: Discover the collection ...
