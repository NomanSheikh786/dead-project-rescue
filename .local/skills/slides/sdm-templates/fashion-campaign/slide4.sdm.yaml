              color:
                kind: rgb
                value: "#C0C0C0"
              letterSpacingPt: 0.23
          align: center
          lineHeight: 1.6
      overflow: visible
    rotationDeg: 0.02
  - id: shape2
    type: shape
    frame:
      x: 836.48
