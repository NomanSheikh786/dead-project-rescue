format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: image
  assetId: forest-canopy
  fit: cover
elements:
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 90
      stops:
        - offset: 0
          color:
            kind: rgb
            value: "#0A120D"
          opacity: 0.9
        - offset: 0.4
          color:
            kind: rgb
            value: "#0A120D"
          opacity: 0.7
        - offset: 1
          color:
            kind: rgb
            value: "#0A120D"
