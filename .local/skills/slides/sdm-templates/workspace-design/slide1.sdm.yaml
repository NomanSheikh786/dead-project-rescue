format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#121216"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: coworking-skyline
    altText: Workspace Skyline
    fit: cover
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 90
      stops:
        - offset: 0.4
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
        - offset: 0.6
          color:
            kind: rgb
            value: "#121216"
          opacity: 0.85
        - offset: 1
          color:
            kind: rgb
            value: "#121216"
          opacity: 0.98
  - id: text1
    type: text
    name: WORKSPACE & INTERIORS
    frame:
      x: 1209.59
      y: 309.92
      width: 276.16
      height: 25.03
    body:
      paragraphs:
