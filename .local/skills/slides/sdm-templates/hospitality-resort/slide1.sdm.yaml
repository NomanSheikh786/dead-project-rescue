            kind: rgb
            value: "#231912"
          opacity: 0.88
        - offset: 0.45
          color:
            kind: rgb
            value: "#231912"
          opacity: 0.6
        - offset: 0.6
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
