format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: image
  assetId: dark-florals
  fit: cover
elements:
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 90
      stops:
        - offset: 0
          color:
            kind: rgb
            value: "#000000"
          opacity: 0.9
        - offset: 1
          color:
            kind: rgb
            value: "#000000"
          opacity: 0.4
