format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#080C08"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: geodesic-greenhouse
    altText: Geodesic Greenhouse Background
    fit: cover
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 90
      stops:
        - offset: 0.5
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
        - offset: 0.58
          color:
            kind: rgb
            value: "#080C08"
          opacity: 0.88
        - offset: 1
          color:
            kind: rgb
            value: "#080C08"
          opacity: 0.92
  - id: text1
    type: text
    name: ⬡
