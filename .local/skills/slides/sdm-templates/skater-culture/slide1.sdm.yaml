format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#0A0805"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: skater-sunset
    altText: Skater at sunset
    fit: cover
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 180
      stops:
        - offset: 0.45
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
        - offset: 1
          color:
            kind: rgb
            value: "#0A0805"
          opacity: 0.85
  - id: text1
    type: text
    name: MADE FOR THE CULTURE
    frame:
