format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#05050F"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: astronaut-space
    altText: Space Background
    fit: cover
    opacity: 0.5
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 0
      stops:
        - offset: 0.1
          color:
            kind: rgb
            value: "#05050F"
        - offset: 0.5
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
        - offset: 0.9
          color:
            kind: rgb
            value: "#05050F"
