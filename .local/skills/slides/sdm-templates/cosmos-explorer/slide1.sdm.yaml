format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#05050F"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: astronaut-space
    altText: Astronaut floating in space
    fit: cover
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 90
      stops:
        - offset: 0.55
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
        - offset: 0.65
          color:
            kind: rgb
            value: "#05050F"
          opacity: 0.7
        - offset: 1
          color:
            kind: rgb
            value: "#05050F"
          opacity: 0.85
  - id: text1
    type: text
    name: MISSION BRIEF
    frame:
      x: 1171.19
      y: 86.39
      width: 175.09
      height: 25.92
    body:
      paragraphs:
        - runs:
            - text: MISSION BRIEF
              font:
                kind: family
