format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#000000"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: photo-racecar
    altText: F1 racecar at night
    fit: cover
    opacity: 0.25
  - id: shape1
    type: shape
