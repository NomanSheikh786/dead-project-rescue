      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 60.64
      stops:
        - offset: 0
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
        - offset: 0.85
