              font:
                kind: family
                family: Inter
              sizePt: 11.52
              weight: 400
              color:
                kind: rgb
                value: "#666666"
          lineHeight: 1.5
      overflow: visible
    rotationDeg: 0.02
  - id: shape2
    type: shape
    frame:
      x: 829.11
      y: 547.41
      width: 261.77
      height: 60.3
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: none
    stroke:
      color:
        kind: rgb
        value: "#1A1A1A"
      widthPt: 0.5
  - id: text3
    type: text
    name: GET IN TOUCH
    frame:
      x: 829.11
      y: 547.41
      width: 261.82
      height: 60.3
    body:
      paragraphs:
        - runs:
