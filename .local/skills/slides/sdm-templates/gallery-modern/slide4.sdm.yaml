format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#FCFAF8"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: art-gallery
    altText: Art Gallery
    fit: cover
    rotationDeg: 180
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 0
      stops:
        - offset: 0.4
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
        - offset: 0.6
          color:
            kind: rgb
            value: "#FCFAF8"
          opacity: 0.95
        - offset: 1
          color:
            kind: rgb
            value: "#FCFAF8"
  - id: text1
    type: text
    name: Let's Collaborate.
    frame:
      x: 575.05
      y: 341.27
      width: 917.04
      height: 96
    body:
      paragraphs:
        - runs:
            - text: Let's Collaborate.
              font:
                kind: family
                family: Space Grotesk
              sizePt: 48
              weight: 400
              color:
                kind: rgb
                value: "#1A1A1A"
              letterSpacingPt: -0.96
          lineHeight: 1
      overflow: visible
  - id: text2
    type: text
    name: studio@example.com
    frame:
      x: 842.73
      y: 469.66
      width: 234.58
      height: 34.56
    body:
