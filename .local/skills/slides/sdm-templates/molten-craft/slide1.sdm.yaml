      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 180
      stops:
        - offset: 0
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
        - offset: 0.18
          color:
            kind: rgb
            value: "#000000"
          opacity: 0.5
        - offset: 1
          color:
            kind: rgb
            value: "#000000"
          opacity: 0.6
