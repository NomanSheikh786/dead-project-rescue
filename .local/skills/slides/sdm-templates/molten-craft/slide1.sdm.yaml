format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: linearGradient
  angleDeg: 60.64
  stops:
    - offset: 0
      color:
        kind: rgb
        value: "#000000"
      opacity: 0
    - offset: 1
      color:
        kind: rgb
        value: "#000000"
      opacity: 0.7
