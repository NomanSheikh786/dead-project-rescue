format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: image
  assetId: desert-dunes
  fit: cover
elements:
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 135
      stops:
        - offset: 0
          color:
            kind: rgb
            value: "#1E140A"
          opacity: 0.8
        - offset: 1
          color:
            kind: rgb
            value: "#1E140A"
          opacity: 0.2
  - id: text1
    type: text
    name: ACME.CO
    frame:
      x: 153.59
      y: 86.39
      width: 144.97
      height: 42.31
    body:
      paragraphs:
        - runs:
            - text: ACME.CO
              font:
                kind: family
                family: DM Sans
              sizePt: 13.44
              weight: 300
              color:
                kind: rgb
                value: "#FDFBF7"
              letterSpacingPt: 1.344
          lineHeight: 1.5
      overflow: visible
  - id: text2
    type: text
    name: "2026"
    frame:
      x: 1710.25
