format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#FFFFFF"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: origami-fashion
    altText: Origami Fashion Background
    fit: cover
  - id: text1
    type: text
    name: COUTURE
    frame:
      x: 192
      y: 324
      width: 1768.31
      height: 520.39
    body:
      paragraphs:
        - runs:
            - text: COUTURE
              font:
                kind: family
                family: Space Grotesk
              sizePt: 172.8
              weight: 800
              color:
                kind: rgb
                value: "#0A0A0A"
              letterSpacingPt: 9.6
          lineHeight: 1.5
      overflow: visible
    opacity: 0.04
    rotationDeg: 0.02
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 0
      width: 153.59
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: rgb
        value: "#0A0A0A"
  - id: text2
    type: text
    name: ISSUE 01
    frame:
      x: 30.8
