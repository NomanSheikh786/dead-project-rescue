      width: 94.81
      height: 48
    body:
      paragraphs:
        - runs:
            - text: ISSUE 01
              font:
                kind: family
                family: Space Grotesk
              sizePt: 7.68
              weight: 400
              color:
                kind: rgb
                value: "#FFFFFF"
              letterSpacingPt: 1.92
          lineHeight: 1.5
      overflow: visible
    rotationDeg: 90
  - id: text3
    type: text
    name: Example Deck
    frame:
      x: -175
      y: 395
      width: 800
      height: 100
    body:
      paragraphs:
        - runs:
            - text: Example Deck
              font:
                kind: family
                family: Space Grotesk
              sizePt: 57.6
              weight: 700
              color:
                kind: rgb
                value: "#0A0A0A"
              letterSpacingPt: -2.88
          lineHeight: 0.8
      overflow: visible
    rotationDeg: 90
  - id: text4
    type: text
