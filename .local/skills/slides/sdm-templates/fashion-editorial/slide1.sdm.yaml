format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: rgb
    value: "#000000"
elements:
  - id: image1
    type: image
    frame:
      x: 0
      y: 0
      width: 1920
      height: 1080
    assetId: photo-fashion-face
    altText: Fashion Face
    fit: cover
  - id: shape1
    type: shape
    frame:
      x: 0
      y: 810
      width: 1920
      height: 270
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: linearGradient
      angleDeg: 0
      stops:
        - offset: 0
          color:
            kind: rgb
            value: "#000000"
          opacity: 0.4
        - offset: 1
          color:
            kind: rgb
            value: "#000000"
          opacity: 0
